name: NodeJS CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Démarrer le serveur
        run: |
          npm run prod &
          sleep 10

      - name: Tester l'API
        run: curl http://localhost:3000/api